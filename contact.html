<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Kami Solutions</title>
  <meta name="description" content="Get in touch with Kami Solutions. Let's discuss your website, software, brand, or automation project.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-page="contact">
<div id="site-top"></div>
<main id="main">

<section class="page-hero">
  <div class="container">
    <span class="mono kicker">Get in touch</span>
    <h1 class="display">Let's build <span class="dim">something great.</span></h1>
    <p class="lede">Tell us about your project. We'll respond within 24 hours with honest thoughts on how we can help.</p>
  </div>
</section>

<section class="section rule-top" style="padding-top:clamp(40px,6vw,88px)">
  <div class="container contact-grid">
    <div><span class="mono kicker" style="margin-bottom:28px">Direct</span><div class="contact-list" id="contact-list"></div></div>
    <div><span class="mono kicker" style="margin-bottom:28px">Project brief</span><div id="contact-form-mount"></div></div>
  </div>
</section>

<section class="section rule-top">
  <div class="container">
    <div class="section-head"><div><span class="mono kicker">What happens next</span><h2 class="h2">After you send your message.</h2></div></div>
    <div class="next" id="next-steps"></div>
  </div>
</section>

</main>
<div id="site-bottom"></div>
<script src="js/config.js"></script>
<script src="js/components.js"></script>
<script src="js/animations.js"></script>
<script src="js/app.js"></script>
